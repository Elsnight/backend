services:
  postgres:
    image: postgres:16
    container_name: rescatefresco-db
    environment:
      POSTGRES_USER: rescatefresco
      POSTGRES_PASSWORD: rescatefresco123
      POSTGRES_DB: rescatefresco
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: